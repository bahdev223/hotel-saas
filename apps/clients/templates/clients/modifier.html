{% extends 'clients/base_clients.html' %}

{% block title %}Modifier {{ client.nom_complet }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto space-y-6">
    <div class="flex items-center gap-4">
        <a href="{% url 'clients:detail' client.id %}" class="text-on-surface-muted hover:text-on-surface"><i class="fas fa-arrow-left text-xl"></i></a>
        <div>
            <h1 class="text-2xl font-bold text-on-surface">
                <i class="fas fa-user-edit text-primary mr-2"></i>Modifier
            </h1>
            <p class="text-sm text-on-surface-muted mt-1">{{ client.nom_complet }} · {{ client.id }}</p>
        </div>
    </div>

    <form method="post" class="card-bro card-bro-static p-6 space-y-4">
        {% csrf_token %}
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="text-xs font-medium text-on-surface-muted">Nom <span class="text-error">*</span></label>
                <input type="text" name="nom" value="{{ client.nom }}" required class="border border-border bg-surface-card rounded-xl px-3 py-2 text-sm w-full">
            </div>
            <div>
                <label class="text-xs font-medium text-on-surface-muted">Prénom</label>
                <input type="text" name="prenom" value="{{ client.prenom }}" class="border border-border bg-surface-card rounded-xl px-3 py-2 text-sm w-full">
            </div>
        </div>
        <div>
            <label class="text-xs font-medium text-on-surface-muted">Téléphone <span class="text-red-400">*</span></label>
            <input type="text" name="telephone" value="{{ client.telephone|default:'' }}" required class="border border-border bg-surface-card rounded-xl px-3 py-2 text-sm w-full">
        </div>
        <div>
            <label class="text-xs font-medium text-on-surface-muted">Email</label>
            <input type="email" name="email" value="{{ client.email|default:'' }}" class="border border-border bg-surface-card rounded-xl px-3 py-2 text-sm w-full">
        </div>
        <div>
            <label class="text-xs font-medium text-on-surface-muted">Adresse</label>
            <textarea name="adresse" class="border border-border bg-surface-card rounded-xl px-3 py-2 text-sm w-full" rows="2">{{ client.adresse|default:'' }}</textarea>
        </div>
        <div>
            <label class="text-xs font-medium text-on-surface-muted">Type de client</label>
            <select name="type_client" class="border border-border bg-surface-card rounded-xl px-3 py-2 text-sm w-full">
                {% for t in types_client %}
                <option value="{{ t }}" {% if client.type_client == t %}selected{% endif %}>{{ t }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="flex gap-3 pt-2">
            <button type="submit" class="flex-1 rounded-xl bg-primary text-white py-2 text-sm"><i class="fas fa-save mr-1"></i>Enregistrer</button>
            <a href="{% url 'clients:detail' client.id %}" class="flex-1 border border-border py-2 rounded-xl text-sm text-center hover:bg-surface-soft transition">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
