{% extends 'catalogue/base_catalogue.html' %}

{% block title %}Catalogue — Produits, Menus & Chambres{% endblock %}

{% block content %}
<div x-data="catalogueApp()" x-init="init()" class="space-y-6">

    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-semibold">Catalogue</h1>
            <p class="text-sm text-on-surface-muted">Tous les articles vendables</p>
        </div>
        <div class="flex gap-2">
            <select x-model="filtre_domaine" @change="charger()" class="border border-border bg-surface-card rounded-xl px-3 py-2 text-sm">
                <option value="">Tous domaines</option>
                <template x-for="d in domaines" :key="d.id">
                    <option :value="d.id" x-text="d.nom"></option>
                </template>
            </select>
        </div>
    </div>

    <div class="grid grid-cols-3 gap-4">
        <div class="card-bro card-bro-static p-5 border-l-4 border-primary">
            <p class="text-sm text-on-surface-muted">Produits</p>
            <p class="text-2xl font-bold text-primary mt-1" x-text="stats.produits"></p>
        </div>
        <div class="card-bro card-bro-static p-5 border-l-4 border-green-500">
            <p class="text-sm text-on-surface-muted">Menus</p>
            <p class="text-2xl font-bold text-green-600 mt-1" x-text="stats.menus"></p>
        </div>
        <div class="card-bro card-bro-static p-5 border-l-4 border-blue-500">
            <p class="text-sm text-on-surface-muted">Chambres</p>
            <p class="text-2xl font-bold text-blue-600 mt-1" x-text="stats.chambres"></p>
        </div>
    </div>

    <div class="flex gap-2 border-b border-border">
        <button @click="onglet = 'produits'" class="px-4 py-2 text-sm font-medium transition border-b-2"
                :class="onglet === 'produits' ? 'border-primary text-primary' : 'border-transparent text-on-surface-muted hover:text-on-surface'">
            <i class="fas fa-box mr-1"></i> Produits
        </button>
        <button @click="onglet = 'menus'" class="px-4 py-2 text-sm font-medium transition border-b-2"
                :class="onglet === 'menus' ? 'border-primary text-primary' : 'border-transparent text-on-surface-muted hover:text-on-surface'">
            <i class="fas fa-utensils mr-1"></i> Menus
        </button>
        <button @click="onglet = 'chambres'" class="px-4 py-2 text-sm font-medium transition border-b-2"
                :class="onglet === 'chambres' ? 'border-primary text-primary' : 'border-transparent text-on-surface-muted hover:text-on-surface'">
            <i class="fas fa-bed mr-1"></i> Chambres
        </button>
    </div>

    <div x-show="onglet === 'produits'" class="flex items-center gap-2 flex-wrap">
        <button @click="filtreCategorie = ''; charger()"
                class="px-3 py-1 text-xs font-medium rounded-full transition-all"
                :class="!filtreCategorie ? 'bg-primary/10 text-primary' : 'bg-surface-soft text-on-surface-muted hover:bg-white/50'">Tous</button>
        <template x-for="cat in categories_produits" :key="cat">
            <button @click="filtreCategorie = cat; charger()"
                    class="px-3 py-1 text-xs font-medium rounded-full transition-all"
                    :class="filtreCategorie === cat ? 'bg-primary/10 text-primary' : 'bg-surface-soft text-on-surface-muted hover:bg-white/50'"
                    x-text="cat"></button>
        </template>
    </div>

    <div x-show="onglet === 'menus'" class="flex items-center gap-2 flex-wrap">
        <button @click="filtreTypeMenu = ''; charger()"
                class="px-3 py-1 text-xs font-medium rounded-full transition-all"
                :class="!filtreTypeMenu ? 'bg-primary/10 text-primary' : 'bg-surface-soft text-on-surface-muted hover:bg-white/50'">Tous</button>
        <template x-for="tm in types_menus" :key="tm">
            <button @click="filtreTypeMenu = tm; charger()"
                    class="px-3 py-1 text-xs font-medium rounded-full transition-all"
                    :class="filtreTypeMenu === tm ? 'bg-primary/10 text-primary' : 'bg-surface-soft text-on-surface-muted hover:bg-white/50'"
                    x-text="tm"></button>
        </template>
    </div>

    <div class="relative" x-show="onglet === 'produits'">
        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-muted text-sm"></i>
        <input type="text" x-model="search" @input.debounce.300ms="charger()" class="border border-border bg-surface-card rounded-xl pl-9 px-3 py-2 text-sm w-full" placeholder="Rechercher un produit...">
    </div>

    <div x-show="onglet === 'produits'" class="card-bro overflow-hidden">
        <div class="overflow-x-auto">
            <table class="bro-table w-full text-sm">
                <thead>
                    <tr>
                        <th>Produit</th>
                        <th>Catégorie</th>
                        <th>Domaine</th>
                        <th class="text-center">Image</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="p in produits" :key="p.id">
                        <tr>
                            <td>
                                <span class="font-medium" x-text="p.nom"></span>
                                <code class="text-xs text-on-surface-muted ml-2" x-text="p.code"></code>
                            </td>
                            <td class="text-on-surface-muted" x-text="p.categorie || '-'"></td>
                            <td>
                                <span class="badge-bro bg-primary-soft text-primary" x-text="p.domaine || '-'"></span>
                            </td>
                            <td class="text-center">
                                <img x-show="p.image_url" :src="p.image_url" class="w-10 h-10 rounded-xl object-cover mx-auto">
                                <span x-show="!p.image_url" class="text-on-surface-muted text-xs"><i class="fas fa-image"></i></span>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="!produits.length">
                        <td colspan="4" class="px-4 py-12 text-center text-on-surface-muted">
                            <i class="fas fa-box text-3xl mb-2 block opacity-30"></i>
                            Aucun produit trouvé
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div x-show="onglet === 'menus'" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="m in menus" :key="m.id">
            <div class="card-bro overflow-hidden">
                <div x-show="m.image_url" class="h-32 bg-surface-soft">
                    <img :src="m.image_url" class="w-full h-full object-cover">
                </div>
                <div class="p-4">
                    <h3 class="font-semibold" x-text="m.nom"></h3>
                    <p class="text-xs text-on-surface-muted mt-1">
                        <span class="badge-bro bg-primary-soft text-primary" x-text="m.type_menu"></span>
                        <span x-show="m.prix_vente" class="ml-2"><i class="fas fa-tag mr-1"></i><span x-text="m.prix_vente + ' GNF'"></span></span>
                    </p>
                    <p x-show="m.description" class="text-sm text-on-surface-muted mt-2 line-clamp-2" x-text="m.description"></p>
                </div>
            </div>
        </template>
        <div x-show="!menus.length" class="col-span-full py-12 text-center text-on-surface-muted">
            <i class="fas fa-utensils text-3xl mb-2 block opacity-30"></i>
            Aucun menu
        </div>
    </div>

    <div x-show="onglet === 'chambres'" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="c in chambres" :key="c.id">
            <div class="card-bro overflow-hidden">
                <div x-show="c.image_url" class="h-32 bg-surface-soft">
                    <img :src="c.image_url" class="w-full h-full object-cover">
                </div>
                <div class="p-4">
                    <h3 class="font-semibold" x-text="c.nom"></h3>
                    <p class="text-xs text-on-surface-muted mt-1">
                        <span x-show="c.type_chambre" class="badge-bro bg-blue-100 text-blue-700" x-text="c.type_chambre"></span>
                        <span x-show="c.capacite" class="ml-2"><i class="fas fa-user mr-1"></i><span x-text="c.capacite + ' pers.'"></span></span>
                    </p>
                    <p x-show="c.description" class="text-sm text-on-surface-muted mt-2 line-clamp-2" x-text="c.description"></p>
                </div>
            </div>
        </template>
        <div x-show="!chambres.length" class="col-span-full py-12 text-center text-on-surface-muted">
            <i class="fas fa-bed text-3xl mb-2 block opacity-30"></i>
            Aucune chambre
        </div>
    </div>

</div>

<script>
function catalogueApp() {
    return {
        onglet: 'produits',
        produits: [], menus: [], chambres: [],
        domaines: JSON.parse('{{ domaines_json|safe }}' || '[]'),
        search: '', filtre_domaine: '', filtreCategorie: '', filtreTypeMenu: '',
        categories_produits: [], types_menus: [],
        stats: { produits: 0, menus: 0, chambres: 0 },

        async init() { await this.charger(); },

        async charger() {
            try {
                const r = await fetch('/catalogue/api/items/');
                const d = await r.json();
                this.categories_produits = d.categories_produits || [];
                this.types_menus = d.types_menus || [];
                let prods = d.produits || [];
                if (this.search) {
                    const q = this.search.toLowerCase();
                    prods = prods.filter(p => p.nom.toLowerCase().includes(q) || (p.code || '').toLowerCase().includes(q));
                }
                if (this.filtre_domaine) {
                    prods = prods.filter(p => p.domaine_id === this.filtre_domaine);
                }
                if (this.filtreCategorie) {
                    prods = prods.filter(p => p.categorie === this.filtreCategorie);
                }
                this.produits = prods;
                let menus = d.menus || [];
                if (this.filtreTypeMenu) {
                    menus = menus.filter(m => m.type_menu === this.filtreTypeMenu);
                }
                this.menus = menus;
                this.chambres = d.chambres || [];
                this.stats = {
                    produits: (d.produits || []).length,
                    menus: (d.menus || []).length,
                    chambres: (d.chambres || []).length,
                };
            } catch(e) { console.error(e); }
        }
    }
}
</script>
{% endblock %}
