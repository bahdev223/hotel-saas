{% extends 'base_bro.html' %}

{% block title %}POS — Point de vente{% endblock %}

{% block subnav %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4">
    <nav class="pill-nav">
        <a href="{% url 'pos:liste_points_vente' %}" class="{% if request.resolver_match.url_name == 'liste_points_vente' or request.resolver_match.url_name == 'ajouter_point_vente' or request.resolver_match.url_name == 'detail_point_vente' or request.resolver_match.url_name == 'modifier_point_vente' %}active{% endif %}">
            <i class="fas fa-store mr-1"></i>Points de vente
        </a>
        <a href="{% url 'pos:employe_dashboard' %}" class="{% if request.resolver_match.url_name == 'employe_dashboard' or request.resolver_match.url_name == 'employe_paiement_clients' %}active{% endif %}">
            <i class="fas fa-tachometer-alt mr-1"></i>Mon espace
        </a>
        <a href="{% url 'pos:dashboard_commandes' %}" class="{% if request.resolver_match.url_name == 'dashboard_commandes' or request.resolver_match.url_name == 'cuisine_dashboard' %}active{% endif %}">
            <i class="fas fa-clipboard-list mr-1"></i>Commandes
        </a>
        <a href="{% url 'pos:liste_ventes' %}" class="{% if request.resolver_match.url_name == 'liste_ventes' %}active{% endif %}">
            <i class="fas fa-history mr-1"></i>Ventes
        </a>
        <a href="{% url 'pos:planning' %}" class="{% if request.resolver_match.url_name == 'planning' %}active{% endif %}">
            <i class="fas fa-calendar-alt mr-1"></i>Planning
        </a>
        <a href="{% url 'pos:sessions_liste' %}" class="{% if request.resolver_match.url_name == 'sessions_liste' or request.resolver_match.url_name == 'session_detail' %}active{% endif %}">
            <i class="fas fa-cash-register mr-1"></i>Sessions
        </a>
        <a href="{% url 'pos:raf_dashboard' %}" class="{% if request.resolver_match.url_name == 'raf_dashboard' or request.resolver_match.url_name == 'raf_collecte' or request.resolver_match.url_name == 'raf_transferts' %}active{% endif %}">
            <i class="fas fa-chart-pie mr-1"></i>RAF
        </a>
    </nav>
</div>
{% endblock %}
