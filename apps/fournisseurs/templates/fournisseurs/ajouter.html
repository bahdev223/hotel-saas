{% extends 'fournisseurs/base_fournisseurs.html' %}

{% block title %}Ajouter un fournisseur{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="card-bro card-bro-static">
        <div class="px-6 py-4 border-b border-border flex items-center gap-3">
            <a href="{% url 'fournisseurs:dashboard' %}" class="text-on-surface-muted hover:text-on-surface"><i class="fas fa-arrow-left"></i></a>
            <h2 class="text-lg font-bold"><i class="fas fa-plus-circle text-primary mr-2"></i>Nouveau fournisseur</h2>
        </div>
        <form method="post" class="p-6 space-y-4">
            {% csrf_token %}
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-sm font-medium">Nom *</label>
                    <input type="text" name="nom" class="border border-border bg-surface-card rounded-xl px-3 py-2 text-sm w-full" required>
                </div>
                <div>
                    <label class="text-sm font-medium">Code</label>
                    <input type="text" name="code" class="border border-border bg-surface-card rounded-xl px-3 py-2 text-sm w-full" placeholder="Auto-généré si vide">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-sm font-medium">Téléphone</label>
                    <input type="text" name="telephone" class="border border-border bg-surface-card rounded-xl px-3 py-2 text-sm w-full">
                </div>
                <div>
                    <label class="text-sm font-medium">Email</label>
                    <input type="email" name="email" class="border border-border bg-surface-card rounded-xl px-3 py-2 text-sm w-full">
                </div>
            </div>
            <div>
                <label class="text-sm font-medium">Adresse</label>
                <textarea name="adresse" class="border border-border bg-surface-card rounded-xl px-3 py-2 text-sm w-full" rows="2"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-sm font-medium">Contact</label>
                    <input type="text" name="contact" class="border border-border bg-surface-card rounded-xl px-3 py-2 text-sm w-full">
                </div>
                <div>
                    <label class="text-sm font-medium">NIF / Identifiant fiscal</label>
                    <input type="text" name="identifiant_fiscal" class="border border-border bg-surface-card rounded-xl px-3 py-2 text-sm w-full">
                </div>
            </div>
            <div>
                <label class="text-sm font-medium">Compte comptable</label>
                <select name="compte_comptable_id" class="border border-border bg-surface-card rounded-xl px-3 py-2 text-sm w-full">
                    <option value="">— Aucun —</option>
                    {% for cc in comptes_comptables %}
                    <option value="{{ cc.id }}">{{ cc.code }} — {{ cc.libelle }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="text-sm font-medium">Notes</label>
                <textarea name="notes" class="border border-border bg-surface-card rounded-xl px-3 py-2 text-sm w-full" rows="2"></textarea>
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" class="flex-1 rounded-xl bg-primary text-white text-sm font-medium py-2">Ajouter</button>
                <a href="{% url 'fournisseurs:dashboard' %}" class="flex-1 border border-border py-2 rounded-xl text-sm hover:bg-surface-soft transition text-center">Annuler</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
