{% extends 'base_bro.html' %}

{% block title %}Fournisseurs{% endblock %}

{% block subnav %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
    <div class="pill-nav">
        <a href="{% url 'fournisseurs:dashboard' %}" class="{% if request.resolver_match.view_name == 'fournisseurs:dashboard' %}active{% endif %}">
            <i class="fas fa-truck mr-1.5"></i>Fournisseurs
        </a>
        <a href="{% url 'fournisseurs:ajouter' %}" class="{% if request.resolver_match.view_name == 'fournisseurs:ajouter' or request.resolver_match.view_name == 'fournisseurs:modifier' %}active{% endif %}">
            <i class="fas fa-plus mr-1.5"></i>Ajouter
        </a>
    </div>
</div>
{% endblock %}

{% block content %}{% endblock %}
{% block extra_js %}{% endblock %}
