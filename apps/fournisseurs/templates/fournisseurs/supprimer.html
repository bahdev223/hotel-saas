{% extends 'fournisseurs/base_fournisseurs.html' %}

{% block title %}Désactiver {{ fournisseur.nom }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="card-bro card-bro-static p-8 text-center">
        <i class="fas fa-exclamation-triangle text-5xl text-amber-500 mb-4"></i>
        <h2 class="text-xl font-bold mb-2">Désactiver ce fournisseur ?</h2>
        <p class="text-on-surface-muted text-sm mb-6">
            Êtes-vous sûr de vouloir désactiver <strong>{{ fournisseur.nom }}</strong> ({{ fournisseur.code }}) ?
        </p>
        <form method="post" class="flex gap-3 justify-center">
            {% csrf_token %}
            <button type="submit" class="rounded-xl bg-error-soft text-error text-sm font-medium px-6 py-2 hover:bg-error/10 transition">
                <i class="fas fa-times mr-1"></i>Désactiver
            </button>
            <a href="{% url 'fournisseurs:detail' fournisseur.id %}" class="rounded-xl border border-border px-6 py-2 text-sm hover:bg-surface-soft transition">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
