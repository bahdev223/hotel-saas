{% extends 'base_bro.html' %}

{% block title %}RH — {{ entreprise_courante.nom_commercial|default:entreprise_courante.nom|default:'ERP' }}{% endblock %}

{% block subnav %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4">
    <div class="pill-nav">
        <a href="{% url 'rh:dashboard' %}" class="{% if request.resolver_match.view_name == 'rh:dashboard' %}active{% endif %}">
            <i class="fas fa-chart-pie mr-1.5"></i>Dashboard
        </a>
        <a href="{% url 'rh:liste_employes' %}" class="{% if 'employe' in request.resolver_match.view_name %}active{% endif %}">
            <i class="fas fa-user-tie mr-1.5"></i>Employés
        </a>
        <a href="{% url 'rh:liste_departements' %}" class="{% if 'departement' in request.resolver_match.view_name %}active{% endif %}">
            <i class="fas fa-building mr-1.5"></i>Départements
        </a>
        <a href="{% url 'rh:liste_postes' %}" class="{% if 'poste' in request.resolver_match.view_name %}active{% endif %}">
            <i class="fas fa-briefcase mr-1.5"></i>Postes
        </a>
    </div>
</div>
{% endblock %}
