<div x-show="modals.unite" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm px-4" @click.self="closeModal('unite')">
    <div class="w-full max-w-lg rounded-2xl bg-surface-card border border-border shadow-xl">
        <div class="flex items-center justify-between border-b border-border px-5 py-4">
            <div class="flex items-center gap-3">
                <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary/10 text-primary">
                    <i class="fas fa-door-open"></i>
                </div>
                <div>
                    <h2 class="text-lg font-semibold text-on-surface">Nouvelle chambre</h2>
                    <p class="text-sm text-on-surface-muted">Chambre Standard ou VIP</p>
                </div>
            </div>
            <button @click="closeModal('unite')" class="flex h-9 w-9 items-center justify-center rounded-xl text-on-surface-muted hover:bg-surface-soft hover:text-on-surface">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="space-y-4 p-5">
            <div class="grid gap-4 sm:grid-cols-2">
                <label class="block">
                    <span class="mb-1 block text-sm font-medium text-on-surface-muted">Code</span>
                    <input x-model="uniteForm.code" class="w-full rounded-xl border border-border bg-surface-card px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30" placeholder="CH-101">
                </label>
                <label class="block">
                    <span class="mb-1 block text-sm font-medium text-on-surface-muted">Nom</span>
                    <input x-model="uniteForm.nom" class="w-full rounded-xl border border-border bg-surface-card px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30" placeholder="Chambre 101">
                </label>
            </div>
            <div class="grid gap-4 sm:grid-cols-2">
                <label class="block">
                    <span class="mb-1 block text-sm font-medium text-on-surface-muted">Type</span>
                    <select x-model="uniteForm.type_unite" class="w-full rounded-xl border border-border bg-surface-card px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
                        <option value="CHAMBRE">Chambre (Standard)</option>
                        <option value="VIP">VIP</option>
                    </select>
                </label>
                <label class="block">
                    <span class="mb-1 block text-sm font-medium text-on-surface-muted">Capacite</span>
                    <input type="number" min="1" x-model="uniteForm.capacite" class="w-full rounded-xl border border-border bg-surface-card px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
                </label>
            </div>
            <label class="block">
                <span class="mb-1 block text-sm font-medium text-on-surface-muted">Prix par heure (F)</span>
                <input type="number" min="0" x-model="uniteForm.prix" class="w-full rounded-xl border border-border bg-surface-card px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30" placeholder="0">
            </label>
            <div class="flex gap-3 pt-2">
                <button @click="saveUnite()" class="flex-1 px-4 py-2 rounded-xl bg-primary text-white text-sm font-medium hover:bg-primary/90 transition"><i class="fas fa-check mr-2"></i>Enregistrer</button>
                <button @click="closeModal('unite')" class="flex-1 px-4 py-2 rounded-xl border border-border text-sm font-medium text-on-surface-muted hover:bg-surface-soft transition">Annuler</button>
            </div>
        </div>
    </div>
</div>
