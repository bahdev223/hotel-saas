<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
    <div class="card-bro card-bro-static p-5">
        <p class="text-sm text-on-surface-muted">Total chambres</p>
        <p class="mt-2 text-2xl font-semibold text-on-surface" x-text="stats.total_chambres"></p>
    </div>
    <div class="card-bro card-bro-static p-5">
        <p class="text-sm text-on-surface-muted">Disponibles</p>
        <p class="mt-2 text-2xl font-semibold text-emerald-600" x-text="stats.chambres_disponibles"></p>
    </div>
    <div class="card-bro card-bro-static p-5">
        <p class="text-sm text-on-surface-muted">Occupees</p>
        <p class="mt-2 text-2xl font-semibold text-amber-600" x-text="stats.chambres_occupees"></p>
    </div>
    <div class="card-bro card-bro-static p-5">
        <p class="text-sm text-on-surface-muted">CA du mois</p>
        <p class="mt-2 text-2xl font-semibold text-primary" x-text="formatMoney(stats.ca_mois) + ' F'"></p>
    </div>
</div>
