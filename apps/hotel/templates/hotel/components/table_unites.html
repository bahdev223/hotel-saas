<div class="overflow-x-auto">
    <table class="w-full min-w-[720px] bro-table">
        <thead>
            <tr>
                <th>Code</th>
                <th>Nom</th>
                <th>Type</th>
                <th class="text-right">Capacite</th>
                <th class="text-right">Prix/h</th>
                <th class="text-center">Statut</th>
                <th class="text-center">Actions</th>
            </tr>
        </thead>
        <tbody>
            <template x-for="u in unites" :key="u.id">
                <tr>
                    <td class="font-medium text-on-surface" x-text="u.code"></td>
                    <td class="text-on-surface" x-text="u.nom"></td>
                    <td class="text-on-surface" x-text="u.type_display || u.type_unite"></td>
                    <td class="text-right text-on-surface" x-text="u.capacite"></td>
                    <td class="text-right font-mono text-primary" x-text="formatMoney(u.prix) + ' F'"></td>
                    <td class="text-center">
                        <span class="badge-bro bg-surface-soft text-on-surface-muted" x-text="u.statut"></span>
                    </td>
                    <td class="text-center">
                        <button @click="supprimerUnite(u.id, u.code)" class="text-error hover:text-error/80 transition" title="Supprimer">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            </template>
            <tr x-show="unites.length === 0">
                <td colspan="7" class="px-4 py-8 text-center text-on-surface-muted">Aucune unite chargee</td>
            </tr>
        </tbody>
    </table>
</div>
