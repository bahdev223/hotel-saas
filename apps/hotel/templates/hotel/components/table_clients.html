<div class="card-bro card-bro-static overflow-hidden">
    <div class="flex items-center justify-between border-b border-border bg-surface-soft px-6 py-4">
        <h3 class="font-semibold text-on-surface">Clients</h3>
        <button @click="openModal('client')" class="px-3 py-2 text-sm rounded-xl bg-primary/10 text-primary hover:bg-primary/20 transition font-medium"><i class="fas fa-plus mr-1"></i>Ajouter</button>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full min-w-[720px] bro-table">
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Telephone</th>
                    <th>Email</th>
                    <th>Adresse</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="c in clients" :key="c.id">
                    <tr>
                        <td class="font-medium text-on-surface" x-text="c.nom + ' ' + c.prenom"></td>
                        <td class="text-on-surface" x-text="c.telephone"></td>
                        <td class="text-on-surface" x-text="c.email || '-'"></td>
                        <td class="text-on-surface" x-text="c.adresse || '-'"></td>
                    </tr>
                </template>
                <tr x-show="clients.length === 0">
                    <td colspan="4" class="px-4 py-8 text-center text-on-surface-muted">Aucun client charge</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
