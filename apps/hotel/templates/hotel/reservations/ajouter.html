{% extends 'hotel/base_hotel.html' %}
{% load static %}

{% block title %}Nouvelle réservation{% endblock %}
{% block header %}<i class="fas fa-plus-circle text-secondary mr-2"></i>Nouvelle réservation{% endblock %}
{% block subtitle %}Créer une réservation{% endblock %}

{% block inner_content %}
<div class="max-w-3xl mx-auto">
    <form method="post" class="card-bro card-bro-static p-6 space-y-5">
        {% csrf_token %}

        <div class="grid grid-cols-2 gap-4">
            <div class="col-span-2">
                <label class="block text-xs font-medium text-on-surface-muted mb-1">Client</label>
                <select name="client" class="w-full rounded-xl border border-border bg-surface-card px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30" required>
                    <option value="">---</option>
                    {% for c in clients %}
                    <option value="{{ c.id }}">{{ c.nom_complet }} - {{ c.telephone }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-on-surface-muted mb-1">Date d'arrivée</label>
                <input type="datetime-local" name="date_arrivee_prevue" class="w-full rounded-xl border border-border bg-surface-card px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30" required>
            </div>
            <div>
                <label class="block text-xs font-medium text-on-surface-muted mb-1">Date de départ</label>
                <input type="datetime-local" name="date_depart_prevue" class="w-full rounded-xl border border-border bg-surface-card px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30" required>
            </div>
            <div>
                <label class="block text-xs font-medium text-on-surface-muted mb-1">Type de chambre</label>
                <select name="type_chambre" id="type_chambre" class="w-full rounded-xl border border-border bg-surface-card px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
                    <option value="">---</option>
                    {% for tc in types_chambres %}
                    <option value="{{ tc.id }}">{{ tc.nom }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-on-surface-muted mb-1">Chambre</label>
                <select name="chambre" id="chambre" class="w-full rounded-xl border border-border bg-surface-card px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30" required>
                    <option value="">Sélectionnez d'abord un type</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-on-surface-muted mb-1">Tarif</label>
                <select name="tarif" id="tarif" class="w-full rounded-xl border border-border bg-surface-card px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30" required>
                    <option value="">Sélectionnez d'abord une chambre</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-on-surface-muted mb-1">Adultes</label>
                <input type="number" name="nombre_adultes" value="1" min="1" class="w-full rounded-xl border border-border bg-surface-card px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
            </div>
            <div>
                <label class="block text-xs font-medium text-on-surface-muted mb-1">Enfants</label>
                <input type="number" name="nombre_enfants" value="0" min="0" class="w-full rounded-xl border border-border bg-surface-card px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
            </div>
        </div>

        <div>
            <label class="block text-xs font-medium text-on-surface-muted mb-1">Notes</label>
            <textarea name="notes" rows="3" class="w-full rounded-xl border border-border bg-surface-card px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30" placeholder="Optionnel..."></textarea>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="flex-1 px-4 py-2 rounded-xl bg-primary text-white text-sm font-medium hover:bg-primary/90 transition"><i class="fas fa-save mr-1"></i>Créer la réservation</button>
            <a href="{% url 'hotel:liste_reservations' %}" class="flex-1 border border-border py-2 rounded-xl text-sm text-center hover:bg-surface-soft transition">Annuler</a>
        </div>
    </form>
</div>

<script>
document.getElementById('type_chambre').addEventListener('change', function() {
    const typeId = this.value;
    const chambreSelect = document.getElementById('chambre');
    const tarifSelect = document.getElementById('tarif');
    chambreSelect.innerHTML = '<option value="">Chargement...</option>';
    tarifSelect.innerHTML = '<option value="">Sélectionnez d\'abord une chambre</option>';

    if (typeId) {
        fetch('/hotel/api/unites/?type_chambre=' + typeId)
            .then(r => r.json())
            .then(data => {
                chambreSelect.innerHTML = '<option value="">---</option>';
                if(data.success && data.unites) {
                    data.unites.forEach(u => {
                        chambreSelect.innerHTML += `<option value="${u.id}">${u.code} - ${u.nom}</option>`;
                    });
                }
            });
    } else {
        chambreSelect.innerHTML = '<option value="">---</option>';
    }
});

document.getElementById('chambre').addEventListener('change', function() {
    const chambreId = this.value;
    const tarifSelect = document.getElementById('tarif');

    if (chambreId) {
        fetch('/hotel/api/tarifs/?chambre=' + chambreId)
            .then(r => r.json())
            .then(data => {
                tarifSelect.innerHTML = '<option value="">---</option>';
                if(data.success && data.tarifs) {
                    if (data.tarifs.length === 0) {
                        tarifSelect.innerHTML = '<option value="">Aucun tarif pour cette chambre</option>';
                    }
                    data.tarifs.forEach(t => {
                        const montant = Number(t.montant).toLocaleString('fr-FR');
                        tarifSelect.innerHTML += `<option value="${t.id}">${t.nom} — ${montant} F</option>`;
                    });
                }
            });
    } else {
        tarifSelect.innerHTML = '<option value="">---</option>';
    }
});
</script>
{% endblock %}
