{% extends 'base_bro.html' %}

{% block subnav %}
<nav class="bg-white/50 backdrop-blur-sm border-b border-border overflow-x-auto scrollbar-bro">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2">
        <div class="pill-nav">
            <a href="{% url 'hotel:dashboard' %}" class="{% if request.resolver_match.view_name == 'hotel:dashboard' %}active{% endif %}"><i class="fas fa-chart-pie mr-1.5"></i>Dashboard</a>
            <a href="{% url 'hotel:liste_unites' %}" class="{% if 'unite' in request.resolver_match.view_name %}active{% endif %}"><i class="fas fa-door-open mr-1.5"></i>Chambres</a>
            <a href="{% url 'hotel:liste_reservations' %}" class="{% if 'reservation' in request.resolver_match.view_name %}active{% endif %}"><i class="fas fa-calendar-check mr-1.5"></i>Réservations</a>
            <a href="{% url 'hotel:liste_sejours' %}" class="{% if 'sejour' in request.resolver_match.view_name %}active{% endif %}"><i class="fas fa-bed mr-1.5"></i>Séjours</a>
        </div>
    </div>
</nav>
{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <div>
        <h1 class="text-2xl font-bold text-on-surface tracking-tight">{% block header %}{% endblock %}</h1>
        <p class="text-sm text-on-surface-muted">{% block subtitle %}{% endblock %}</p>
    </div>
</div>
{% block inner_content %}{% endblock %}
{% endblock %}
