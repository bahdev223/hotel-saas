{% extends "comptabilite/base_compta.html" %}

{% block comptatitle %}Nouvelle recette - Comptabilité{% endblock %}

{% block header %}Nouvelle recette{% endblock %}
{% block subtitle %}Encaissement hors vente{% endblock %}

{% block comptacontent %}
<div class="max-w-2xl mx-auto">
    <form method="post" class="card-bro card-bro-static p-6 space-y-4">
        {% csrf_token %}

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">Date *</label>
                <input type="date" name="date_operation" required class="w-full px-3 py-2 rounded-lg border border-border bg-surface-card text-on-surface">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Client</label>
                <input type="text" name="client" class="w-full px-3 py-2 rounded-lg border border-border bg-surface-card text-on-surface" placeholder="Nom du client (optionnel)">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Description *</label>
            <input type="text" name="description" required class="w-full px-3 py-2 rounded-lg border border-border bg-surface-card text-on-surface" placeholder="Motif de la recette">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Montant (FCFA) *</label>
            <input type="number" step="1" name="montant" required class="w-full px-3 py-2 rounded-lg border border-border bg-surface-card text-on-surface">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">Mode de paiement</label>
                <select name="mode_paiement" class="w-full px-3 py-2 rounded-lg border border-border bg-surface-card text-on-surface">
                    <option value="ESPECES">💰 Espèces</option>
                    <option value="CARTE">💳 Carte bancaire</option>
                    <option value="VIREMENT">🏦 Virement</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Caisse</label>
                <select name="caisse_id" class="w-full px-3 py-2 rounded-lg border border-border bg-surface-card text-on-surface">
                    <option value="">-- Sélectionner --</option>
                    {% for caisse in caisses %}
                    <option value="{{ caisse.id }}">{{ caisse.nom }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Notes</label>
            <textarea name="notes" rows="2" class="w-full px-3 py-2 rounded-lg border border-border bg-surface-card text-on-surface"></textarea>
        </div>

        <div class="flex gap-3 pt-4">
            <button type="submit" class="flex-1 bg-primary text-white py-2 rounded-lg">Enregistrer la recette</button>
            <a href="{% url 'comptabilite:operations' %}" class="flex-1 border border-border py-2 rounded-lg text-center text-on-surface">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
