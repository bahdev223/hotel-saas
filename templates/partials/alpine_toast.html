<div x-data
     class="fixed top-4 right-4 z-[100] flex flex-col gap-2 max-w-sm pointer-events-none">
    <template x-for="(t, i) in $store.toast.items" :key="i">
        <div x-show="t.show" x-transition:enter="transform transition ease-out duration-300"
             x-transition:enter-start="translate-x-full opacity-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="translate-x-0 opacity-100"
             x-transition:leave-end="translate-x-full opacity-0"
             class="pointer-events-auto flex items-center gap-3 rounded-lg p-4 border-l-4 text-sm shadow-lg"
             :class="t.color">
            <i class="fas" :class="t.icon"></i>
            <span x-text="t.message"></span>
        </div>
    </template>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.store('toast', { items: [] });
});
window.notify = function(message, type = 'success', duration = 4000) {
    const config = {
        success: { icon: 'fa-check-circle', color: 'bg-green-50 border-green-500 text-green-800' },
        error:   { icon: 'fa-exclamation-circle', color: 'bg-red-50 border-red-500 text-red-800' },
        warning: { icon: 'fa-exclamation-triangle', color: 'bg-orange-50 border-orange-500 text-orange-800' },
        info:    { icon: 'fa-info-circle', color: 'bg-blue-50 border-blue-500 text-blue-800' },
    };
    const c = config[type] || config.info;
    const store = Alpine.store('toast');
    const toast = { ...c, message, show: true };
    store.items.push(toast);
    setTimeout(() => {
        toast.show = false;
        setTimeout(() => { store.items = store.items.filter(t => t !== toast); }, 300);
    }, duration);
};
</script>
